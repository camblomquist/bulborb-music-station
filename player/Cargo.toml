[package]
name = "bms-player"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
atomic_refcell = "0.1.13"
bms-common = { workspace = true }
midly = { workspace = true }
oxisynth = "0.1.0"
ringbuf = "0.4.8"
tinyaudio = "2.0.0"

# Temporary
bms-composer = { version = "0.1.0", path = "../composer" }

[dependencies.rand]
version = "0.9"
features = ["small_rng"]

[dependencies.spin]
version = "0.10.0"
default-features = false
features = ["mutex", "spin_mutex", "std"]
